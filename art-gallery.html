<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夜幕決鬥｜素材與環境展示</title><link rel="stylesheet" href="src/css/dist/art-gallery.css?v=d137797b2d35">
</head><body><main class="gallery"><h1>夜幕決鬥・統一美術展示</h1><p>古金雕刻 × 墨綠琺瑯。基本卡跨職業共用；職業與特殊卡使用專屬招式。每組依序為一般、選取、停用。</p><div class="gallery-controls"><button data-env="day">白天</button><button data-env="night">夜襲</button><button id="domainToggle">切換持續領域</button><a href="Nightfall-Duel-V12.12.39-Test.html">進入遊戲</a></div><div class="duel-screen png-frame hero"><div class="retro-center"><span class="round-mini">環境預覽</span><span class="vsx">VS</span></div></div><div id="skills" class="gallery-controls"></div><div id="cards" class="art-grid"></div><h2>共用牌背</h2><p>所有職業與未揭曉卡牌共用同一張古金墨綠牌背。簡化背景雕花，保留中央寶石封印與月牙識別。</p><figure style="margin:16px 0"><img src="assets/cards/back-gold-v2.webp" alt="古金雕刻、墨綠琺瑯與中央寶石封印的共用牌背" style="display:block;width:min(240px,100%);height:auto;border-radius:6px"><figcaption><a href="assets/cards/back-gold-v2.webp">查看牌背原圖</a></figcaption></figure><h2>日月硬幣</h2><div class="coin-gallery"><figure><img src="assets/coins/sun.webp" alt="古金日輪硬幣"><figcaption>白天</figcaption></figure><figure><img src="assets/coins/moon.webp" alt="古金月牙硬幣"><figcaption>夜襲</figcaption></figure></div><p><a href="assets/environments/day.webp">白天背景原圖</a> · <a href="assets/environments/night.webp">夜襲背景原圖</a> · <a href="icon-gallery.html">SVG 圖示展示</a> · <a href="frame-gallery.html">PNG 邊框展示</a></p></main><script src="src/js/icon-registry.js?v=5bbe2e1202d8"></script><script src="src/js/card-art.js?v=996a20449389"></script><script src="src/js/game-art.js?v=0c52153c3b77"></script><script src="src/js/environment.js?v=dcab52c7a19d"></script><script>
const preview={session:'gallery',p:{night:false,domainActive:false},a:{night:false,domainActive:false}};
NDEnvironment.sync(preview);
document.querySelectorAll('[data-env]').forEach(b=>b.onclick=()=>{preview.p.night=b.dataset.env==='night';NDEnvironment.sync(preview)});
document.querySelector('#domainToggle').onclick=()=>{preview.p.domainActive=!preview.p.domainActive;NDEnvironment.sync(preview)};
for(const art of Object.values(ND_CARD_ART)){
 const panel=document.createElement('section');panel.className='art-panel png-frame';panel.innerHTML=`<h3>${art.label} · ${{basic:'共用基本卡',class:'職業卡',special:'特殊卡'}[art.category]}</h3><div class="art-states">${['normal','selected','disabled'].map(state=>`<button class="card ${state}" data-art="${art.key}" ${state==='disabled'?'disabled':''} aria-label="${art.label} ${state}"><span class="icon"></span><b>${art.label}</b></button>`).join('')}</div><a class="original" href="${art.src}">查看原畫</a>`;document.querySelector('#cards').append(panel);
 if(art.category!=='basic'){const b=document.createElement('button');b.textContent=art.label;b.onclick=()=>NDEnvironment.cast({k:art.category==='class'?'class':art.key,job:art.key});document.querySelector('#skills').append(b)}
}
NDVisuals.refresh();
</script></body></html>
