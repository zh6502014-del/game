<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夜幕決鬥｜續篇素材展示（J1–J4）</title>
<!-- 素材展示頁，不給遊戲讀取。刻意放在 docs/ 而不是根目錄：scripts/build-preload-manifest.py 只掃根目錄 *.html，
     放在根目錄會讓這些「尚未接入遊戲」的續篇素材進入預載清單，被玩家背景下載。素材接入遊戲後，由程式引用自然登錄預載。 -->
<style>
body{margin:0;background:#141414;color:#e6dcc4;font:15px/1.6 "Noto Serif TC",serif}
main{max-width:1200px;margin:auto;padding:24px}
h1,h2{color:#c29a4b}h2{border-bottom:1px solid #2b4a3a;padding-bottom:4px;margin-top:32px}
a{color:#c29a4b}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(var(--w,180px),1fr))}
figure{margin:0;background:#1f3a2e;border:1px solid #2b4a3a;border-radius:6px;padding:8px}
figure img{display:block;width:100%;height:auto;background:repeating-conic-gradient(#23201c 0 25%,#2a2723 0 50%) 0 0/16px 16px}
figcaption{font-size:12px;margin-top:6px;word-break:break-all}figcaption b{display:block;font-size:14px}
</style></head><body><main>
<h1>續篇素材展示（J1–J4）</h1>
<p>美術交接 2026-11-15，清單見 <a href="handoff-MANIFEST.md">handoff-MANIFEST.md</a>，規範見 <a href="art-bible.md">art-bible.md</a>。以下素材<strong>目前沒有接入遊戲流程</strong>，只做登錄與檢視。</p>
<div id="sections"></div>
<p><a href="../../../art-gallery.html">← 回統一美術展示</a></p>
</main><script>
const A='../../../assets/';
const groups=[
 ['角色立繪 · assets/story/actors/sequel/','180px',[
  ['luis','璐易絲'],['luis-cmd','璐易絲 · 指揮'],['shuo-steam','朔 · 蒸汽臂套'],['shuo-steam-damaged','朔 · 右臂套破損'],
  ['serson','瑟爾遜'],['serson-wheelchair','瑟爾遜 · 輪椅'],['serson-mecha','瑟爾遜 · 機甲'],['serson-mecha-out','瑟爾遜 · 停機脫離'],
  ['serson-blackmarket','瑟爾遜 · 黑市'],['mecha-body','外掛式機甲'],['royal-officer','皇權派軍官'],['herman-mecha','赫爾曼博士 · 全機體（敵人）']].map(([f,t])=>['story/actors/sequel/'+f+'.webp',t])],
 ['敵人戰鬥肖像 · assets/characters/enemies/','180px',[['characters/enemies/royal-guard.webp','皇權派衛兵'],['characters/enemies/herman-battle.webp','赫爾曼博士']]],
 ['場景背景 · assets/story/backgrounds/locations/','320px',[
  ['bg-lanvale-gate','蘭維爾南城門'],['bg-arnfeld-gate','阿恩費爾德城門'],['bg-tunnel-entrance','隧道入口與閥門室'],['bg-tunnel-deep','隧道深處'],
  ['bg-infirmary','邊境醫護所'],['bg-hub-station','樞紐站大廳（三面旗配色已於 11/14 核准）'],['bg-hub-control','樞紐站控制室']].map(([f,t])=>['story/backgrounds/locations/'+f+'.webp',t])],
 ['劇情圖 · assets/story/illustrations/chapters/','320px',[
  ['cg-runaway-train','失控列車'],['cg-three-paths','三條路'],['cg-hub-retake-wheelchair','奪回樞紐 · 輪椅路線'],
  ['cg-hub-retake-mecha','奪回樞紐 · 機甲路線'],['cg-hub-retake-blackmarket','奪回樞紐 · 黑市路線']].map(([f,t])=>['story/illustrations/chapters/'+f+'.webp',t])],
 ['特效 · assets/story/fx/sequel/','160px',[
  'fx-flame-cone','fx-frost-burst','fx-heat-puff-1','fx-heat-puff-2','fx-heat-puff-3','fx-jet-plume',
  'fx-mecha-shutdown','fx-ram-dust','fx-steam-burst','fx-steam-slash','fx-tether-spark'].map(f=>['story/fx/sequel/'+f+'.webp',f])],
 ['技能牌面 · assets/story/fx/skill-cards/','160px',[
  'card-cold','card-fist','card-flame','card-overload','card-qi','card-recoil','card-shield','card-up'].map(f=>['story/fx/skill-cards/'+f+'.webp',f])],
 ['狀態圖示 · assets/ui/status/','110px',[
  'ui-status-airborne','ui-status-burn','ui-status-frozen','ui-status-overheat'].map(f=>['ui/status/'+f+'.webp',f])]
];
const root=document.querySelector('#sections');
for(const [title,w,items] of groups){
 const h=document.createElement('h2');h.textContent=title;root.append(h);
 const g=document.createElement('div');g.className='grid';g.style.setProperty('--w',w);root.append(g);
 for(const [p,t] of items){const f=document.createElement('figure');f.innerHTML=`<a href="${A+p}"><img loading="lazy" src="${A+p}" alt="${t}"></a><figcaption><b>${t}</b>assets/${p}</figcaption>`;g.append(f)}
}
</script></body></html>
